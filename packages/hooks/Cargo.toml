[package]
name = "hooks"
version = "3.0.0-alpha.7"
edition = "2021"
description = "Compile-time, async hooks"
license = "MIT"
documentation = "https://docs.rs/hooks"
repository = "https://github.com/frender-rs/hooks"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hooks-macro = { path = "../hooks-macro", version = "0.2.0", optional = true }
hooks-core = { path = "../hooks-core", version = "3.0.0-alpha.3", default-features = false }
pin-project-lite = "0.2.9"
hooks-gen = { version = "0.1.0", path = "../hooks-gen", optional = true }

[dev-dependencies]
futures-lite = "2.3.0"
async-io = "2.3.3"

[features]
default = ["futures-core", "all"]
proc-macro = ["hooks-macro"]
futures-core = ["hooks-core/futures-core"]
all = [
    "ShareValue",
    "Signal",
    "use_debug",
    "use_default_pinned",
    "use_effect",
    "use_lazy_pinned",
    "use_lazy_pinned_hook",
    "use_memo",
    "use_mut",
    "use_poll_next_update",
    "use_shared_ref",
    "use_shared_signal",
    "use_state_with_updater",
    "use_uninitialized_hook",

    "use_shared_update_state",

    "use_shared_call",
    "use_shared_reducer",
    "use_shared_set",
    "use_shared_toggle",

    "use_gen_ref",
    "use_gen_signal",
]
ShareValue = []
Signal = ["ShareValue"]
use_debug = []
use_default_pinned = []
use_effect = []
use_lazy_pinned = ["use_default_pinned"]
use_lazy_pinned_hook = []
use_memo = []
use_mut = []
use_poll_next_update = []
use_shared_ref = []
use_shared_signal = []
use_state_with_updater = []
use_uninitialized_hook = []

UpdateState = ["use_state_with_updater"]
use_shared_update_state = ["UpdateState"]

use_shared_call = ["use_shared_update_state"]
use_shared_reducer = ["use_shared_update_state"]
use_shared_set = ["use_shared_update_state"]
use_shared_toggle = ["use_shared_update_state"]

use_gen_ref = ["dep:hooks-gen"]
use_gen_signal = ["dep:hooks-gen"]

[package.metadata.docs.rs]
all-features = true
